[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "canable-sdk"
version = "0.2.0"
description = "Windows WinUSB transport for the verified single-channel Candlelight CANable firmware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
]

[tool.setuptools]
packages = ["canable"]
include-package-data = false

[tool.setuptools.package-data]
canable = ["_native.dll"]
